<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::section}, 'overdue')}">
<head><title>Borçlular · ISP Billing</title></head>
<body>
<section>
    <header class="page-head">
        <div>
            <h1>Borçlular</h1>
            <p class="muted">Son ödeme tarihi geçmiş, tamamen ödenmemiş faturalar</p>
        </div>
        <div class="balance" th:classappend="${total.signum() > 0} ? 'balance-due'">
            <span class="muted">Toplam gecikmiş alacak</span>
            <strong th:text="${@fmt.money(total)}"></strong>
        </div>
    </header>
    <div class="card">
        <p class="empty" th:if="${invoices.isEmpty()}">Vadesi geçmiş fatura yok. 🎉</p>
        <table th:unless="${invoices.isEmpty()}">
            <thead><tr><th>Abone</th><th>Fatura no</th><th>Dönem</th><th>Son ödeme</th><th class="num">Gecikme</th><th class="num">Kalan</th></tr></thead>
            <tbody>
            <tr th:each="i : ${invoices}">
                <td><a th:href="@{/customers/{id}(id=${i.customerId})}" th:text="${i.customerName}"></a></td>
                <td><a class="mono" th:href="@{/invoices/{id}(id=${i.id})}" th:text="${i.invoiceNo}"></a></td>
                <td th:text="${@fmt.period(i.periodStart)}"></td>
                <td class="text-danger" th:text="${@fmt.date(i.dueDate)}"></td>
                <td class="num" th:text="|${@fmt.daysSince(i.dueDate)} gün|"></td>
                <td class="num" th:text="${@fmt.money(i.openAmount)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
