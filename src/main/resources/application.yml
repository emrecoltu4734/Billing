spring:
  application:
    name: isp-billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}
  mvc:
    format:
      date: iso
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  paths-to-match: /api/v1/**

billing:
  # Abonelerin fatura bağlantısını açacağı adres (yalnızca /f/** internete açılır)
  public-base-url: ${BILLING_PUBLIC_BASE_URL:http://localhost:8080}
  # Faturada görünen İSS bilgileri
  company:
    name: ${BILLING_COMPANY_NAME:Örnek İnternet Hizmetleri}
    address: ${BILLING_COMPANY_ADDRESS:}
    tax-office: ${BILLING_COMPANY_TAX_OFFICE:}
    tax-id: ${BILLING_COMPANY_TAX_ID:}
    phone: ${BILLING_COMPANY_PHONE:}
    email: ${BILLING_COMPANY_EMAIL:}
    website: ${BILLING_COMPANY_WEBSITE:}
    iban: ${BILLING_COMPANY_IBAN:}
  # Fatura numarası öneki (e-Arşiv formatında 3 karakter: ABC2026000000001)
  invoice-prefix: ISP
  # Son ödeme günü = fatura tarihi + bu kadar gün
  payment-term-days: 15
  # İlk açılışta hiç kullanıcı yoksa bu yönetici oluşturulur.
  # Şifre verilmezse rastgele üretilip loga yazılır.
  admin:
    username: ${BILLING_ADMIN_USER:admin}
    password: ${BILLING_ADMIN_PASSWORD:}
  # Giriş tablolarını (in_*) işleyen aktarım batch'i
  import:
    enabled: ${BILLING_IMPORT_ENABLED:true}
    interval: ${BILLING_IMPORT_INTERVAL:PT1M}
  # Otomatik faturalama: her gece, fatura günü gelen ve otomatik çalışması açık fatura dönemleri faturalanır
  auto-run:
    enabled: ${BILLING_AUTO_RUN_ENABLED:true}
    cron: ${BILLING_AUTO_RUN_CRON:0 30 2 * * *}
  # Fatura kesinleşince aboneye e-posta / SMS
  notification:
    dispatch-enabled: ${BILLING_NOTIFICATION_DISPATCH:true}
    interval: PT1M
    email:
      mode: ${BILLING_EMAIL_MODE:off}          # off | log | smtp  (smtp: spring.mail.host/port/username/password)
      from: ${BILLING_EMAIL_FROM:}
    sms:
      mode: ${BILLING_SMS_MODE:off}            # off | log | http
      http:
        url: ${BILLING_SMS_URL:}               # yer tutucular: {phone} {message} {username} {password} {sender}
        method: ${BILLING_SMS_METHOD:GET}
        body: ${BILLING_SMS_BODY:}
        content-type: ${BILLING_SMS_CONTENT_TYPE:application/x-www-form-urlencoded}
        success-pattern: ${BILLING_SMS_SUCCESS_PATTERN:}
        username: ${BILLING_SMS_USERNAME:}
        password: ${BILLING_SMS_PASSWORD:}
        sender: ${BILLING_SMS_SENDER:}
